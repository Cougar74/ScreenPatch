[package]
name = "screenpatch"
version = "0.1.0"
edition = "2021"
publish = false
description = "ScreenPatch step 1: floating captures on mixed-DPI monitors"

[dependencies]
softbuffer = "0.4"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
winit = "0.30.13"
xcap = { version = "0.9.8", features = ["wgc"] }
